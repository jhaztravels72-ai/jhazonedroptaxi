<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jhaz One Drop Taxi</title>
    <style>
        /* நவீன மொபைல் வடிவமைப்பு */
        :root {
            --primary: #fbc02d; /* பிரகாசமான மஞ்சள் */
            --dark: #1a1a1a;    /* நவீன கருப்பு */
            --bg: #f8f9fa;      /* மென்மையான வெள்ளை */
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--dark);
        }

        /* பிராண்ட் தலைப்பு */
        header {
            background-color: var(--dark);
            color: #fff;
            padding: 25px 15px;
            text-align: center;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 1px;
            border-bottom: 5px solid var(--primary);
        }

        header span {
            color: var(--primary);
        }

        .main-wrapper {
            max-width: 450px;
            margin: 30px auto;
            background: #fff;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        h2 {
            text-align: center;
            font-size: 20px;
            margin-bottom: 25px;
            color: #333;
        }

        .input-box {
            position: relative;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
            color: #555;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 16px;
            transition: 0.3s;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            outline: none;
        }

        /* சொகுசான பட்டன் */
        .btn-book {
            width: 100%;
            padding: 15px;
            background-color: var(--primary);
            color: var(--dark);
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(251, 192, 45, 0.3);
            transition: 0.3s;
        }

        .btn-book:hover {
            background-color: var(--dark);
            color: #fff;
            transform: translateY(-2px);
        }

        /* பில் ரசீது பகுதி */
        .receipt {
            margin-top: 25px;
            padding: 20px;
            background-color: #f1f8e9;
            border-top: 4px dashed #8bc34a;
            border-radius: 8px;
            display: none;
        }

        .receipt h3 {
            margin-top: 0;
            color: #33691e;
        }
    </style>
</head>
<body>

    <header>
        🚕 JHAZ <span>ONE DROP TAXI</span>
    </header>

    <div class="main-wrapper">
        <h2>உங்களின் பாதுகாப்பான பயணத்தை புக் செய்யவும்</h2>
        <form id="bookingForm">
            <div class="input-box">
                <label>பெயர்</label>
                <input type="text" id="custName" required placeholder="உங்கள் பெயர்">
            </div>

            <div class="input-box">
                <label>தொலைபேசி எண்</label>
                <input type="tel" id="custPhone" required placeholder="9876543210">
            </div>

            <div class="input-box">
                <label>புறப்படும் இடம் (Pickup)</label>
                <input type="text" id="pickupLoc" required placeholder="எங்கிருந்து கிளம்புகிறீர்கள்?">
            </div>

            <div class="input-box">
                <label>சென்றடையும் இடம் (Drop)</label>
                <input type="text" id="dropLoc" required placeholder="எங்கு செல்ல வேண்டும்?">
            </div>

            <div class="input-box">
                <label>தோராயமான தூரம் (கி.மீ-இல்)</label>
                <input type="number" id="travelKm" min="1" required placeholder="உதாரணமாக: 45">
            </div>

            <button type="submit" class="btn-book">உடனடியாக புக் செய் ➔</button>
        </form>

        <div id="finalReceipt" class="receipt">
            <h3>மகிழ்ச்சியான பயணம்! 🎉</h3>
            <p id="rName"></p>
            <p id="rRoute"></p>
            <p id="rPrice" style="font-size: 18px; font-weight: bold; color: #33691e;"></p>
            <p style="font-size: 13px; color: #666;">*எங்கள் ஓட்டுநர் உங்களை 5 நிமிடங்களில் அழைப்பார்.</p>
        </div>
    </div>

    <script>
        document.getElementById('bookingForm').addEventListener('submit', function(event) {
            event.preventDefault();

            const name = document.getElementById('custName').value;
            const phone = document.getElementById('custPhone').value;
            const pickup = document.getElementById('pickupLoc').value;
            const drop = document.getElementById('dropLoc').value;
            const km = parseFloat(document.getElementById('travelKm').value);

            // கட்டணம் கணக்கிடுதல் (1 கி.மீ-க்கு ₹14 என தோராயமாக)
            const totalFare = km * 14;

            document.getElementById('rName').innerText = "வாடிக்கையாளர் பெயர்: " + name + " (" + phone + ")";
            document.getElementById('rRoute').innerText = "பாதை: " + pickup + " முதல் " + drop + " வரை";
            document.getElementById('rPrice').innerText = "தோராயக் கட்டணம்: ₹" + totalFare;

            document.getElementById('finalReceipt').style.display = 'block';
            document.getElementById('bookingForm').reset();
        });
    </script>

</body>
</html>
