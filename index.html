<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jhaz One Drop Taxi</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f8f9fa; text-align: center; color: #333; }
        header { background-color: #ffcc00; padding: 25px; color: #000; font-weight: bold; }
        h1 { margin: 0; font-size: 28px; }
        .container { padding: 15px; max-width: 500px; margin: auto; }
        .card { background: white; padding: 20px; margin: 15px 0; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.05); text-align: left; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 15px; }
        .btn-whatsapp { display: block; background-color: #25D366; color: white; text-align: center; padding: 14px; border-radius: 5px; text-decoration: none; font-weight: bold; font-size: 18px; margin-top: 20px; border: none; width: 100%; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>

    <header>
        <h1>🚕 Jhaz One Drop Taxi</h1>
        <p>Call to Book Instantly: +91 80153 12300</p>
    </header>

    <div class="container">
        <!-- Form Section -->
        <div class="card">
            <h2>🚖 Quick Booking Form</h2>
            <form id="taxiForm">
                <div class="form-group">
                    <label>Trip Type (பயண வகை)</label>
                    <select id="tripType" required>
                        <option value="One Way">One Way (ஒரு வழி)</option>
                        <option value="Round Trip">Round Trip (இரு வழி)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Vehicle (வாகனம்)</label>
                    <select id="carType" required>
                        <option value="SEDAN 4+1">SEDAN 4+1 (₹15/km)</option>
                        <option value="SUV 6+1">SUV 6+1 (₹20/km)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Full Name (பெயர்)</label>
                    <input type="text" id="custName" placeholder="உங்கள் பெயர்" required>
                </div>
                <div class="form-group">
                    <label>Mobile Number (மொபைல் எண்)</label>
                    <input type="tel" id="custPhone" placeholder="மொபைல் எண்" required>
                </div>
                <div class="form-group">
                    <label>Pickup Location (ஏறும் இடம்)</label>
                    <input type="text" id="pickLoc" placeholder="எங்கிருந்து" required>
                </div>
                <div class="form-group">
                    <label>Drop Location (இறங்கும் இடம்)</label>
                    <input type="text" id="dropLoc" placeholder="எங்கு செல்ல வேண்டும்" required>
                </div>
                <div class="form-group">
                    <label>Pickup Date & Time (தேதி & நேரம்)</label>
                    <input type="datetime-local" id="dateTime" required>
                </div>
                
                <button type="button" onclick="sendToWA()" class="btn-whatsapp">💬 Book via WhatsApp Instantly</button>
            </form>
        </div>

        <!-- Tariff Section -->
        <div class="card">
            <h2>💰 Tariff (கட்டண விவரங்கள்)</h2>
            <table>
                <tr><th>Vehicle</th><th>One Way</th><th>Round Trip</th></tr>
                <tr><td>SEDAN</td><td>₹15/km</td><td>₹14/km</td></tr>
                <tr><td>SUV</td><td>₹20/km</td><td>₹19/km</td></tr>
            </table>
        </div>
    </div>

    <script>
        function sendToWA() {
            var trip = document.getElementById('tripType').value;
            var car = document.getElementById('carType').value;
            var name = document.getElementById('custName').value;
            var phone = document.getElementById('custPhone').value;
            var pick = document.getElementById('pickLoc').value;
            var drop = document.getElementById('dropLoc').value;
            var dt = document.getElementById('dateTime').value;

            if(!name || !phone || !pick || !drop || !dt) {
                alert("தயவுசெய்து அனைத்து விவரங்களையும் நிரப்பவும்!");
                return;
            }

            var msg = "வணக்கம் Jhaz One Drop Taxi, புதிய புக் செய்ய விரும்புகிறேன்:\n\n" +
                      "• வகை: " + trip + "\n" +
                      "• கார்: " + car + "\n" +
                      "• பெயர்: " + name + "\n" +
                      "• போன்: " + phone + "\n" +
                      "• Pickup: " + pick + "\n" +
                      "• Drop: " + drop + "\n" +
                      "• தேதி: " + dt;

            // Direct official WhatsApp URL
            var finalLink = "https://wa.me" + encodeURIComponent(msg);
            window.location.href = finalLink;
        }
    </script>

</body>
</html>
